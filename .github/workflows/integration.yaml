on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

name: integration

permissions: read-all

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      DRAGONFARM_INTEGRATION: "true"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
      - name: Cache Python environment and model files
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/R/reticulate
            ~/.cache/huggingface
          key: py-${{ runner.os }}-${{ hashFiles('R/python.R') }}
      - name: Python unit tests
        # The uv-built environment has no pip, so run the test functions directly.
        run: |
          Rscript -e 'devtools::load_all(); py <- dragonfarm:::dragon_python(); q(status = system2(py, c("inst/python/tests/run.py"), env = "PYTHONPATH=inst/python"))'
      - name: Integration tests
        run: Rscript -e 'devtools::test(filter = "integration", stop_on_failure = TRUE)'
